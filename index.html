<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-udl.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <title>UDL - Unión Deportiva Laspiur</title>
    <script>
      ;(function () {
        var theme =
          localStorage.getItem('udl-theme') === 'light'
            ? 'lara-light-teal'
            : 'lara-dark-teal'
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.id = 'primevue-theme'
        link.href = '/themes/' + theme + '/theme.css'
        document.head.appendChild(link)
        document.documentElement.classList.add(
          localStorage.getItem('udl-theme') === 'light' ? 'theme-light' : 'theme-dark'
        )
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
